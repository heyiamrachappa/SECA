# ==============================================================================
# Configuration: Smart Electricity Consumption Analytics & Demand Forecasting
# ==============================================================================

app:
  name: "Smart Electricity Consumption Analytics"
  version: "1.0.0"
  description: "Big Data Electricity Consumption Analytics & Demand Forecasting (London SmartMeter Dataset)"
  environment: "local"

spark:
  app_name: "SmartElectricityAnalytics"
  master: "local[*]"
  driver_memory: "4g"
  executor_memory: "4g"
  sql_shuffle_partitions: "16"
  timezone: "UTC"
  log_level: "WARN"

paths:
  raw_data_dir: "dataset/raw"
  processed_data_dir: "dataset/processed"
  sample_data_dir: "dataset/sample"
  models_dir: "models"
  reports_dir: "reports"
  logs_dir: "logs"

dataset:
  name: "Low Carbon London SmartMeter Energy Consumption Dataset"
  source: "London Datastore (UK Power Networks)"
  canonical_columns:
    household_id: "LCLid"
    timestamp: "DateTime"
    consumption: "KWH/hh (per half hour) "
  standardized_columns:
    household_id: "household_id"
    timestamp: "timestamp"
    consumption_kwh: "consumption_kwh"
  sample_size_households: 25
  sample_readings_limit: 100000

preprocessing:
  null_replacement: 0.0
  max_valid_kwh_half_hour: 25.0
  min_valid_kwh_half_hour: 0.0

forecasting:
  target_column: "consumption_kwh"
  test_split_ratio: 0.20
  forecast_horizon_hours: 24
  lag_hours: [1, 2, 3, 24, 48, 168]
  rolling_windows_hours: [3, 6, 24]
  random_seed: 42

anomaly_detection:
  z_score_threshold: 3.0
  isolation_forest:
    contamination: 0.02
    n_estimators: 100
    random_state: 42

dashboard:
  theme: "dark"
  default_date_range_days: 30
